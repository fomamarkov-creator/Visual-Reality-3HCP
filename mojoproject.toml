[project]
name = "visual-reality-3hcp"
version = "0.1.0"
description = "Visual Reality 3HCP: 12-Fold Spatial Matrix Core & Neural Rendering Engine"
authors = ["Efim S. Markov <visual-reality-3hcp@example.com>"]
channels = ["conda-forge", "modular-channels"]
platforms = ["linux-64", "win-64"]

[dependencies]
max-mojo = ">=1.0.0"

[tasks]
run = "mojo markov_user_interface.mojo"
build = "mojo build markov_user_interface.mojo"

# Специальные переопределения для разных ОС (используем строго дефисы в именах выходных файлов)
[target.linux-64.tasks]
run = "mojo markov_user_interface.mojo"
build = "mojo build markov_user_interface.mojo -o visual-reality-3hcp-linux"

[target.win-64.tasks]
run = "mojo.exe markov_user_interface.mojo"
build = "mojo build markov_user_interface.mojo -o visual-reality-3hcp-windows.exe"
