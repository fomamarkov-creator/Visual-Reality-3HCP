name: Compile and Release Visual Reality 3HCP (Windows)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Executable on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Установка официального скоростного менеджера uv
      - name: Install uv Build Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # 2. Чистая глобальная установка компилятора Mojo 1.0.0 через официальный индекс Modular
      - name: Install Mojo Compiler via uv
        run: |
          uv tool install mojo-compiler --index-url https://dl.modular.com/public/nightly/python/simple/
        shell: bash

      # 3. Прямая компиляция вашего интерфейса в исполняемый .exe файл
      - name: Compile Windows Executable
        run: |
          mojo build markov_user_interface.mojo -o visual-reality-3hcp.exe
        shell: bash

      # 4. Отправка готового .exe в раздел релизов на GitHub (для публичных версий)
      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: visual-reality-3hcp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Сохранение файла в системный архив при ручном запуске кнопкой
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-windows-build
          path: visual-reality-3hcp.exe
