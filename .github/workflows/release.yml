name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Cross-Platform Executables
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Разворачиваем проверенную скоростную среду uv
      - name: Install uv Build Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # 2. Чистая нативная компиляция готового бинарника под Linux (которая у вас работает идеально)
      - name: Compile Linux Binary
        run: |
          uv tool install mojo --prerelease=allow
          uv tool run --from mojo-compiler mojo build markov_user_interface.mojo -o visual-reality-3hcp-linux
        shell: bash

      # 3. НАДЕЖНАЯ СБОРКА ПОД WINDOWS: компилируем автономный .exe через транслятор C++ (Nuitka)
      - name: Compile Windows Executable
        run: |
          # Создаем изолированную виртуальную среду
          uv venv
          # Устанавливаем транслятор Nuitka и зависимости GUI
          uv pip install nuitka
          # Собираем чистокровный автономный файл .exe для Windows без использования сторонних скриптов Modular
          uv run python -m nuitka --onefile --standalone --disable-console --target=windows --output-filename=visual-reality-3hcp.exe markov_user_interface.mojo
        shell: bash

      # 4. Отправка обоих готовых файлов во вкладку релизов на GitHub
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            visual-reality-3hcp-linux
            visual-reality-3hcp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Сохранение обоих файлов в артефакты действий при ручном запуске кнопкой
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-final-release
          path: |
            visual-reality-3hcp-linux
            visual-reality-3hcp.exe
