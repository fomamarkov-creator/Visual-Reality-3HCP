name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --- 1. СБОРКА ПОД LINUX (ПРОШЛА ИДЕАЛЬНО) ---
  build-linux:
    name: Build on Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv Build Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Mojo and Compile for Linux
        run: |
          uv tool install mojo --prerelease=allow
          uv tool run --from mojo-compiler mojo build markov_user_interface.mojo -o visual-reality-3hcp-linux
        shell: bash

      - name: Upload Linux Binary to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: visual-reality-3hcp-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Linux Artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-linux-build
          path: visual-reality-3hcp-linux

  # --- 2. СБОРКА ПОД WINDOWS НА LINUX-СЕРВЕРЕ (КРОСС-ПЛАТФОРМЕННЫЙ ВАРИАНТ) ---
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Разворачиваем экосистему Pixi, которая умеет изолировать тулчейны
      - name: Setup Pixi Environment
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false

      # Устанавливаем кросс-компилятор и собираем нативный .exe для пользователей
      - name: Cross-Compile Windows Binary
        run: |
          # Инициализируем среду Pixi под новый формат Mojoproject
          pixi init --format mojoproject
          pixi channel add https://modular.com
          pixi channel add conda-forge
          
          # Явно добавляем Windows-версию пакета для линковки архитектуры
          pixi add max-mojo --platform win-64
          
          # Запускаем компиляцию бинарного исполняемого файла .exe
          pixi run --platform win-64 mojo build markov_user_interface.mojo -o visual-reality-3hcp.exe
        shell: bash

      - name: Upload Windows Binary to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: visual-reality-3hcp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Windows Artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-windows-build
          path: visual-reality-3hcp.exe
