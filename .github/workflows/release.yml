name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Cross-Platform Executables
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Разворачиваем сверхбыструю среду uv на стабильном Linux-сервере
      - name: Install uv Build Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # 2. КРОСС-КОМПИЛЯЦИЯ: Создаем Linux-бинарник и Windows .exe на одном шаге
      - name: Compile Executables
        run: |
          # Устанавливаем официальный компилятор Mojo 1.0.0 в окружение Linux
          uv tool install mojo --prerelease=allow
          
          # Сборка финальной версии под Linux (которая у вас уже успешно работала)
          $HOME/.local/bin/mojo build markov_user_interface.mojo -o visual-reality-3hcp-linux
          
          # КРОСС-СБОРКА ПОД WINDOWS: генерирует чистокровный релизный .exe файл через GNU-тулчейн
          $HOME/.local/bin/mojo build markov_user_interface.mojo --target x86_64-pc-windows-gnu -o visual-reality-3hcp.exe
        shell: bash

      # 3. Отправка обоих готовых файлов в раздел релизов на GitHub
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            visual-reality-3hcp-linux
            visual-reality-3hcp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Сохранение обоих файлов в артефакты (для скачивания при ручном тесте по кнопке)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-all-platforms
          path: |
            visual-reality-3hcp-linux
            visual-reality-3hcp.exe
