name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: visual-reality-3hcp
          - os: windows-latest
            artifact_name: visual-reality-3hcp.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Официальное и стабильное развертывание Magic на любой ОС (включая Windows и Linux)
      - name: Set up Magic Build Tool
        uses: modular/setup-magic@v1

      # Инициализация проекта и автоматическое скачивание компилятора Mojo 1.0
      - name: Install Project Dependencies and Mojo
        run: magic install

      # Компиляция бинарного исполняемого файла
      - name: Compile Executable Binary
        run: magic run build

      # Загрузка готовых бинарников в раздел релизов на GitHub
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Резервное сохранение файлов при ручном тесте (кнопка во вкладке Actions)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.artifact_name }}-build
          path: ${{ matrix.artifact_name }}
