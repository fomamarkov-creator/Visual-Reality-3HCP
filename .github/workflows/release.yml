name: Compile and Release Visual Reality 3HCP (Windows)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Executable on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Официальный инструмент автоматического развертывания стабильного компилятора Mojo
      - name: Set up Mojo Compiler
        uses: modularml/setup-mojo@v1

      # Прямая чистая компиляция без промежуточных toml-слоев и сетевых ошибок
      - name: Compile Windows Executable
        run: |
          mojo build markov_user_interface.mojo -o visual-reality-3hcp.exe
        shell: pwsh

      # Отправка готового приложения во вкладку релизов на GitHub
      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: visual-reality-3hcp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Безопасное сохранение .exe в архив артефактов Actions (для тестов кнопкой в привате)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-windows-build
          path: visual-reality-3hcp.exe
