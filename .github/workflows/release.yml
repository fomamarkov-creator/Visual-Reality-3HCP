name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: visual-reality-3hcp-linux
          - os: windows-latest
            artifact_name: visual-reality-3hcp.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Поднимаем чистую изолированную среду Python на каждом сервере (без капризного авто-кэша)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Устанавливаем вычислительные библиотеки и упаковщик PyInstaller
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib pyinstaller

      # 3. Нативная компиляция кода в монолитный исполняемый файл
      - name: Compile Executable Binary
        run: |
          pyinstaller --onefile --noconsole --name visual-reality-3hcp markov_user_interface.py

      # 4. Переименовываем готовый файл под имя артефакта релиза (только для Linux)
      - name: Rename Output Binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: mv dist/visual-reality-3hcp dist/${{ matrix.artifact_name }}
        shell: bash

      # На Windows файл сразу собирается в папке dist\ и мы приводим его имя к стандарту релиза
      - name: Rename Output Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: rename dist\visual-reality-3hcp.exe ${{ matrix.artifact_name }}
        shell: cmd

      # 5. Отправка готовых бинарников во вкладку релизов на GitHub
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. Резервное сохранение файлов в архив действий (для скачивания при ручном тесте)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.artifact_name }}-build
          path: dist/${{ matrix.artifact_name }}
