name: Compile and Release Visual Reality 3HCP (Windows)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Executable on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Скачиваем официальный портативный компилятор Mojo 1.0.0 напрямую без сайтов и скриптов
      - name: Download Portable Mojo Compiler
        run: |
          Invoke-WebRequest -Uri "https://modular.com" -OutFile "mojo.zip"
        shell: powershell

      # 2. Распаковываем архив компилятора в системную папку сервера
      - name: Extract Mojo Compiler
        run: |
          Expand-Archive -Path "mojo.zip" -DestinationPath "D:\mojo-dist"
          echo "D:\mojo-dist\bin" >> $env:GITHUB_PATH
        shell: powershell

      # 3. Чистая и прямая компиляция вашего интерфейса в исполняемый .exe файл
      - name: Compile Windows Executable
        run: |
          & "D:\mojo-dist\bin\mojo.exe" build markov_user_interface.mojo -o visual-reality-3hcp.exe
        shell: pwsh

      # 4. Отправка готового .exe в раздел релизов на GitHub (для публичных версий)
      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: visual-reality-3hcp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Сохранение .exe в архив артефактов (для ручного теста кнопкой в приватном репо)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-windows-build
          path: visual-reality-3hcp.exe
