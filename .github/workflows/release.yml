name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Executable on Linux Container
    runs-on: ubuntu-latest
    # Используем официальный контейнер, где Mojo 1.0.0 уже вшит внутрь
    container:
      image: ghcr.io/modularml/mojo:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Компилируем бинарный файл напрямую встроенным компилятором без curl и лишних утилит
      - name: Compile Executable Binary
        run: |
          mojo build markov_user_interface.mojo -o visual-reality-3hcp

      # Автоматическое прикрепление файла к релизу (для публичных версий)
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: visual-reality-3hcp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Сохранение бинарника в архиве (при ручном тесте по кнопке в приватном репо)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-linux-build
          path: visual-reality-3hcp
