name: Compile and Release Visual Reality 3HCP (Windows)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Executable on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Автономная установка Mojo на Windows через официальный системный скрипт Modular
      # Этот метод вообще не использует Python и pip, поэтому конфликтов пакетов не будет
      name: Install Mojo Compiler via PowerShell
      run: |
        Set-ExecutionPolicy RemoteSigned -Scope Process -Force
        iex ((New-Object System.Net.WebClient).DownloadString('https://modular.com'))
      shell: powershell

      # 2. Принудительное добавление пути к mojo.exe в переменные окружения сервера
      - name: Add Mojo to System PATH
        run: |
          echo "$env:USERPROFILE\.modular\bin" >> $env:GITHUB_PATH
        shell: powershell

      # 3. Чистая и прямая компиляция вашего интерфейса в .exe файл
      - name: Compile Windows Executable
        run: |
          mojo build markov_user_interface.mojo -o visual-reality-3hcp.exe
        shell: pwsh

      # 4. Отправка готового файла в раздел релизов на GitHub
      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: visual-reality-3hcp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Резервное сохранение файла в архив действий (при ручном запуске кнопкой)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-windows-build
          path: visual-reality-3hcp.exe
