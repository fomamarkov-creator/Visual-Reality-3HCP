name: Compile and Release Visual Reality 3HCP (Windows)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Executable on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Поднимаем чистый Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Установка Mojo компилятора через официальный PIP-пакет от Modular
      - name: Install Modular and Mojo Compiler
        run: |
          python -m pip install --upgrade pip
          pip install modular
        shell: pwsh

      # 3. Прямая компиляция без каких-либо toml-зависимостей и прослоек
      - name: Compile Windows Executable
        run: |
          mojo build markov_user_interface.mojo -o visual-reality-3hcp.exe
        shell: pwsh

      # 4. Отправка готового .exe в релизы GitHub
      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: visual-reality-3hcp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Сохранение файла в архиве действий при ручном запуске тестов
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-windows-build
          path: visual-reality-3hcp.exe
