name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: visual-reality-3hcp-linux
          - os: windows-latest
            artifact_name: visual-reality-3hcp.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Поднимаем стандартное и чистое Python-окружение
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Устанавливаем официальный компилятор Mojo напрямую через pip
      - name: Install Mojo Compiler via PIP
        run: |
          python -m pip install --upgrade pip
          pip install mojo

      # 3. Чистая нативная компиляция исполняемых файлов без сторонних плагинов
      - name: Compile Executable Binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mojo build markov_user_interface.mojo -o ${{ matrix.artifact_name }}
        shell: bash

      - name: Compile Executable Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mojo build markov_user_interface.mojo -o ${{ matrix.artifact_name }}
        shell: pwsh

      # 4. Отправка готовых файлов в раздел релизов на GitHub
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Резервное сохранение файлов в архив действий при ручном запуске
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.artifact_name }}-build
          path: ${{ matrix.artifact_name }}
