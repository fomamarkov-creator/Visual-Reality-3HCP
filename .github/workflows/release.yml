name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: visual-reality-3hcp-linux
          - os: windows-latest
            artifact_name: visual-reality-3hcp.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Железобетонная установка скоростного менеджера uv (работает идеально на всех ОС)
      - name: Install uv Build Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # --- ШАГ ДЛЯ UBUNTU LINUX (КОТОРЫЙ У ВАС УЖЕ РАБОТАЛ) ---
      - name: Install Mojo and Compile (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv tool install mojo --prerelease=allow
          uv tool run --from mojo-compiler mojo build markov_user_interface.mojo -o ${{ matrix.artifact_name }}
        shell: bash

      # --- ШАГ ДЛЯ WINDOWS (ЧИСТАЯ СБОРКА БЕЗ СЛОМАННЫХ ССЫЛОК И ПАКЕТОВ) ---
      - name: Install Mojo and Compile (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # Устанавливаем официальный автономный компилятор mojo-compiler напрямую
          uv tool install mojo-compiler --index-url https://modular.com --prerelease=allow
          # Компилируем нативный исполняемый файл .exe
          uv tool run mojo build markov_user_interface.mojo -o ${{ matrix.artifact_name }}
        shell: bash

      # --- ФИНАЛЬНАЯ ЗАГРУЗКА ДЛЯ ОБЕИХ ПЛАТФОРМ ---
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Резервное сохранение в артефакты действий (для скачивания при ручном тесте по кнопке)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.artifact_name }}-build
          path: ${{ matrix.artifact_name }}
