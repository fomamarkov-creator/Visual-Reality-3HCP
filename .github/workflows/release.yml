name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: visual-reality-3hcp-linux
          - os: windows-latest
            artifact_name: visual-reality-3hcp.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Поднимаем стандартное и чистое Python-окружение (есть на всех серверах GitHub)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- ШАГ ДЛЯ LINUX (Сборка через быстрый uv) ---
      - name: Install uv and Compile (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -LsSf https://astral.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv run --with mojo-compiler mojo build markov_user_interface.mojo -o ${{ matrix.artifact_name }}
        shell: bash

      # --- ШАГ ДЛЯ WINDOWS (Чистая сборка через pip без Pixi) ---
      - name: Install Mojo via PIP (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install --upgrade pip
          pip install mojo
        shell: pwsh

      # Компилируем готовый .exe файл для использования пользователями
      - name: Compile Windows Executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mojo build markov_user_interface.mojo -o ${{ matrix.artifact_name }}
        shell: pwsh

      # --- ОТПРАВКА ГОТОВЫХ ФАЙЛОВ В РЕЛИЗЫ ---
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Резервное сохранение в артефакты действий (для ручного теста кнопкой в привате)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.artifact_name }}-build
          path: ${{ matrix.artifact_name }}
