name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: visual-reality-3hcp-linux
          - os: windows-latest
            artifact_name: visual-reality-3hcp.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Разворачиваем чистую изолированную среду Python (работает и на Linux, и на Windows)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Обновляем pip до актуальной версии
      - name: Upgrade PIP
        run: |
          python -m pip install --upgrade pip

      # --- ШАГ ДЛЯ UBUNTU LINUX (Чистая установка без curl и сайтов Astral) ---
      - name: Install Mojo on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install mojo

      - name: Compile Executable Binary (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mojo build markov_user_interface.mojo -o ${{ matrix.artifact_name }}

      # --- ШАГ ДЛЯ WINDOWS (Чистая сборка без Pixi и внешних ToML-файлов) ---
      - name: Install Mojo on Windows
        if: matrix.os == 'windows-latest'
        run: |
          pip install mojo
        shell: pwsh

      - name: Compile Windows Executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mojo build markov_user_interface.mojo -o ${{ matrix.artifact_name }}
        shell: pwsh

      # ---ОТПРАВКА ГОТОВЫХ ФАЙЛОВ ПОЛЬЗОВАТЕЛЯМ ---
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Резервное сохранение файлов в архив действий (при ручном тесте кнопкой в привате)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.artifact_name }}-build
          path: ${{ matrix.artifact_name }}
