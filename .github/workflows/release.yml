name: Compile and Release Visual Reality 3HCP (Windows)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Executable on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Разворачиваем стандартный Python, который есть на серверах GitHub по умолчанию
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Устанавливаем официальный magic глобально через pip
      - name: Install Modular Magic via PIP
        run: |
          python -m pip install --upgrade pip
          pip install modular-magic

      # 3. Скачиваем компилятор Mojo и собираем зависимости проекта
      - name: Install Windows Mojo Compiler
        run: magic install

      # 4. Компилируем ваш интерфейс напрямую в исполняемый .exe файл
      - name: Compile Windows Executable
        run: magic run build

      # 5. Загрузка в релиз (если запуск по кнопке публикации релиза)
      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: visual-reality-3hcp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. Сохранение .exe в архив GitHub Actions (при тесте кнопкой в приватном репо)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-windows-build
          path: visual-reality-3hcp.exe
