name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Cross-Platform Executables
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Установка скоростного менеджера сред uv
      - name: Install uv Build Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # 2. Чистая сборка готового бинарника под Linux (которая работает идеально со 100% успехом)
      - name: Compile Linux Binary
        run: |
          uv tool install mojo --prerelease=allow
          uv tool run --from mojo-compiler mojo build markov_user_interface.mojo -o visual-reality-3hcp-linux
        shell: bash

      # 3. ФИНАЛЬНАЯ СБОРКА ПОД WINDOWS: создаем окружение и пакуем .exe файл
      - name: Compile Windows Executable
        run: |
          # Создаем чистую виртуальную среду на сервере
          uv venv
          # Устанавливаем PyInstaller строго внутри созданной среды
          uv pip install pyinstaller
          # Пакуем код в один монолитный исполняемый файл .exe с поддержкой GUI
          uv run pyinstaller --onefile --noconsole --name visual-reality-3hcp markov_user_interface.mojo
          # Переносим готовый файл в корень для загрузки
          mv dist/visual-reality-3hcp.exe ./visual-reality-3hcp.exe
        shell: bash

      # 4. Отправка обоих готовых файлов во вкладку релизов на GitHub
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            visual-reality-3hcp-linux
            visual-reality-3hcp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Сохранение обоих файлов в артефакты действий при ручном запуске кнопкой
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-all-platforms
          path: |
            visual-reality-3hcp-linux
            visual-reality-3hcp.exe
