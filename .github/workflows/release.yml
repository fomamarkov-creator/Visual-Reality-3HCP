name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Cross-Platform Executables
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Официальный метод развертывания полноценной среды сборщика
      - name: Setup Pixi Environment
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false

      # 2. КРОСС-КОМПИЛЯЦИЯ: Создаем Linux-бинарник и Windows .exe на одном сервере
      - name: Compile Executables
        run: |
          # Устанавливаем компилятор Mojo, явно указав официальный канал репозитория Modular
          pixi global install mojo -c https://conda.modular.com/max -c conda-forge
          
          # Сборка финальной версии под Linux для пользователей
          $HOME/.pixi/bin/mojo build markov_user_interface.mojo -o visual-reality-3hcp-linux
          
          # Сборка готового стабильного релиза под Windows (.exe) через LLVM-таргет
          $HOME/.pixi/bin/mojo build markov_user_interface.mojo --target x86_64-pc-windows-msvc -o visual-reality-3hcp.exe
        shell: bash

      # 3. Отправка обоих готовых файлов во вкладку релизов на GitHub
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            visual-reality-3hcp-linux
            visual-reality-3hcp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Резервное сохранение в артефакты действий (для скачивания при тесте кнопкой в привате)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-all-platforms
          path: |
            visual-reality-3hcp-linux
            visual-reality-3hcp.exe
