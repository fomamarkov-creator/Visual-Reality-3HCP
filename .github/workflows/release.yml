name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Cross-Platform Executables
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Разворачиваем официальный тулчейн Mojo со встроенной кросс-платформенной поддержкой
      - name: Set up Mojo Toolchain
        uses: modularml/setup-mojo@v1
        with:
          mojo-version: '1.0.0'

      # 2. КРОСС-КОМПИЛЯЦИЯ: Создаем Linux-бинарник и Windows .exe на одном надежном сервере
      - name: Compile Executables
        run: |
          # Сборка финальной версии под Linux (код полностью проверен компилятором)
          mojo build markov_user_interface.mojo -o visual-reality-3hcp-linux
          
          # КРОСС-СБОРКА ПОД WINDOWS: Генерирует готовый релизный исполняемый файл .exe
          mojo build markov_user_interface.mojo --target x86_64-pc-windows-msvc -o visual-reality-3hcp.exe
        shell: bash

      # 3. Отправка обоих готовых файлов в раздел релизов на GitHub
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            visual-reality-3hcp-linux
            visual-reality-3hcp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Сохранение обоих файлов в артефакты действий (для скачивания при ручном тесте кнопкой)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-all-platforms
          path: |
            visual-reality-3hcp-linux
            visual-reality-3hcp.exe
