name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Multiplatform Executables
    runs-on: ubuntu-latest
    # Запускаем сборку внутри официального Docker-контейнера разработчиков языка
    container:
      image: ghcr.io/modularml/mojo:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Чистая и прямая компиляция без внешних скачиваний и серверов Windows
      - name: Compile Executables
        run: |
          # 1. Сборка финального бинарника под Linux
          mojo build markov_user_interface.mojo -o visual-reality-3hcp-linux
          
          # 2. КРОСС-СБОРКА ПОД WINDOWS: Генерирует чистокровный, автономный файл .exe для пользователей
          mojo build markov_user_interface.mojo --target x86_64-pc-windows-gnu -o visual-reality-3hcp.exe

      # Автоматическое прикрепление готовых файлов к релизу
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            visual-reality-3hcp-linux
            visual-reality-3hcp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Сохранение файлов в архиве Actions (для скачивания при ручном тесте по кнопке в привате)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-final-build
          path: |
            visual-reality-3hcp-linux
            visual-reality-3hcp.exe
