name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: visual-reality-3hcp-linux
          - os: windows-latest
            artifact_name: visual-reality-3hcp.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Разворачиваем изолированное окружение Pixi с явным указанием манифеста Mojo
      - name: Setup Pixi Environment
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: 'mojoproject.toml' # Указываем Pixi искать именно ваш файл проекта
          run-install: true
          cache: false

      # 2. Чистая нативная компиляция силами самого Mojo
      - name: Compile Executable Binary
        run: |
          pixi run build

      # 3. Переименовываем готовый файл под имя артефакта релиза
      - name: Rename Output Binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: mv markov_user_interface ${{ matrix.artifact_name }}
        shell: bash

      - name: Rename Output Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: rename markov_user_interface ${{ matrix.artifact_name }}
        shell: cmd

      # 4. Отправка готовых файлов в раздел релизов на GitHub
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Резервное сохранение файлов в архив действий (при ручном тесте кнопкой в привате)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.artifact_name }}-build
          path: ${{ matrix.artifact_name }}
