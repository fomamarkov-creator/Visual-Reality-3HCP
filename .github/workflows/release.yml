name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: visual-reality-3hcp
          - os: windows-latest
            artifact_name: visual-reality-3hcp.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Корректный, официально существующий экшен сборщика от разработчиков
      - name: Set up Magic Build Tool
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false

      # Загрузка компилятора Mojo и зависимостей на базе mojoproject.toml
      - name: Install Project Dependencies and Mojo
        run: magic install

      # Сборка готовых бинарных файлов проекта
      - name: Compile Executable Binary
        run: magic run build

      # Отправка собранного ПО в раздел релизов на GitHub
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Резервное копирование файлов в артефакты (при ручном тесте по кнопке)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.artifact_name }}-build
          path: ${{ matrix.artifact_name }}
