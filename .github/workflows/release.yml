name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: visual-reality-3hcp-linux
          - os: windows-latest
            artifact_name: visual-reality-3hcp.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- СБОРКА ПОД LINUX (УЖЕ НА 100% РАБОЧАЯ) ---
      - name: Install uv Build Manager (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Compile Executable Binary (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run --with mojo-compiler mojo build markov_user_interface.mojo -o ${{ matrix.artifact_name }}
        shell: bash

      # --- ЖЕЛЕЗОБЕТОННАЯ СБОРКА ПОД WINDOWS (БЕЗ PIP, UV И ВЕБ-ССЫЛОК) ---
      - name: Download and Install Official Mojo MSI (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # Скачиваем стабильный релиз установщика напрямую из официального архива
          Invoke-WebRequest -Uri "https://github.com" -OutFile "mojo.msi"
          # Запускаем скрытую установку в систему сервера
          Start-Process msiexec.exe -ArgumentList '/i mojo.msi /qn /norestart' -Wait
        shell: powershell

      - name: Add Mojo to System PATH (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "C:\Program Files\Modular\Mojo\bin" >> $env:GITHUB_PATH
        shell: powershell

      - name: Compile Windows Executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mojo build markov_user_interface.mojo -o ${{ matrix.artifact_name }}
        shell: pwsh

      # --- ОТПРАВКА ГОТОВОГО ПО ПОЛЬЗОВАТЕЛЯМ ---
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.artifact_name }}-build
          path: ${{ matrix.artifact_name }}
