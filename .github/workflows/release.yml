name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: visual-reality-3hcp
          - os: windows-latest
            artifact_name: visual-reality-3hcp.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Разворачиваем стандартный Python, который есть везде
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-data: '3.11'

      # Ставим пакетный менеджер magic глобально через pip
      - name: Install Modular Magic Global
        run: |
          pip install modular-magic

      # Скачиваем сам компилятор Mojo и зависимости проекта
      - name: Install Project Dependencies
        run: magic install

      # Компилируем бинарник строго через команду magic
      - name: Compile Executable Binary
        run: magic run build

      # Загружаем готовые файлы в релиз (если запуск по кнопке релиза)
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Если запустили вручную кнопкой в приватном репо, сохраняем файлы в архив GitHub
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.artifact_name }}-build
          path: ${{ matrix.artifact_name }}
