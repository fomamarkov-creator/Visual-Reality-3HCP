name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: visual-reality-3hcp-linux
          - os: windows-latest
            artifact_name: visual-reality-3hcp.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Железобетонная установка скоростного менеджера uv (работает везде)
      - name: Install uv Build Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # 2. Установка компилятора Mojo 1.0.0 через uv (этот шаг у вас уже прошел идеально)
      - name: Install Mojo Compiler
        run: |
          uv tool install mojo --prerelease=allow

      # 3. Чистая компиляция финальной версии (без капризных флагов --target)
      - name: Compile Executable Binary
        run: |
          uv tool run --from mojo-compiler mojo build markov_user_interface.mojo -o ${{ matrix.artifact_name }}

      # 4. Отправка готовых файлов в раздел релизов на GitHub
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Резервное сохранение в артефакты действий (для скачивания при ручном тесте по кнопке)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.artifact_name }}-build
          path: ${{ matrix.artifact_name }}
