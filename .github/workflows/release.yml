name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Cross-Platform Executables
    runs-on: ubuntu-latest
    # Используем официальный и всегда доступный контейнер со встроенным компилятором Mojo
    container:
      image: modularml/max:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Прямая компиляция встроенным в контейнер компилятором без внешних скачиваний
      - name: Compile Executables
        run: |
          # 1. Сборка стабильного бинарника под Linux
          mojo build markov_user_interface.mojo -o visual-reality-3hcp-linux
          
          # 2. КРОСС-СБОРКА ДЛЯ WINDOWS: компилятор внутри контейнера сгенерирует чистый .exe файл
          mojo build markov_user_interface.mojo --target x86_64-pc-windows-msvc -o visual-reality-3hcp.exe
        shell: bash

      # Отправка готовых бинарных файлов в раздел релизов на GitHub
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            visual-reality-3hcp-linux
            visual-reality-3hcp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Резервное сохранение в артефакты (для скачивания при ручном запуске кнопкой в привате)
      - name: Upload Artifacts if Manual Run
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: visual-reality-3hcp-all-platforms
          path: |
            visual-reality-3hcp-linux
            visual-reality-3hcp.exe
