name: Compile and Release Visual Reality 3HCP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: visual-reality-3hcp
          - os: windows-latest
            artifact_name: visual-reality-3hcp.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Установка Magic (Pixi Core) без каких-либо токенов и авторизаций
      - name: Install Magic Build Tool (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -ssL https://magic.modular.com | sh
          echo "$HOME/.modular/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install Magic Build Tool (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          irm https://modular.com | iex
          echo "$env:USERPROFILE\.modular\bin" >> $env:GITHUB_PATH
        shell: powershell

      # 2. Инициализация и скачивание Mojo 1.0 из открытого канала
      - name: Install Project Dependencies and Mojo
        run: magic install

      # 3. Прямая компиляция через задачу из нашего mojoproject.toml
      - name: Compile Executable Binary
        run: magic run build

      # 4. Загрузка в релиз (работает только при публикации официального релиза)
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Сохранение в артефакты (при ручном тесте по кнопке в приватном репо)
      - name: Upload Artifacts if Manual Run
        uses: actions/artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.artifact_name }}-build
          path: ${{ matrix.artifact_name }}
