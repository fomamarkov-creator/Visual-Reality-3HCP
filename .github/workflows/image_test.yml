name: Dynamic Image Comparison Test

on:
  push:
    paths:
      - 'input/**' # Сервер запустится автоматически, как только вы загрузите картинку в папку input

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install image processing tools
        run: pip install opencv-python pillow numpy

      - name: Execute 3HCP Core and Generate Visual Diff
        run: |
          # Здесь запускается ваш тестовый скрипт, который обрабатывает input/test.png
          # и генерирует итоговое сравнение output/comparison.png
          python scripts/process_comparison.py 

      - name: Commit and Push processed comparison
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/comparison.png
          git commit -m "Auto-generated 3HCP vs DLSS visual comparison test" || exit 0
          git push
