name: Dynamic Image Comparison Test

on:
  push:
    paths:
      - 'input/**'       # Запускается автоматически, когда вы загружаете картинку (например, с телефона)
      - 'scripts/**'     # Запускается при обновлении логики расчетов бенчмарка

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Установка headless-пакетов для предотвращения падения из-за отсутствия GUI на сервере
      - name: Install image processing tools
        run: pip install opencv-python-headless pillow numpy

      # Запуск обновленного честного теста с расчетом SSIM, PSNR и генерацией таблицы
      - name: Execute 3HCP Core and Generate Visual Diff
        run: |
          python scripts/process_comparison.py 

      # Пуш результатов обратно на гитхаб
      - name: Commit and Push processed comparison
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # git add обязательно включает README.md, чтобы таблица сохранялась под картинкой
          git add input/ output/comparison.png README.md
          
          git commit -m "Auto-generated 3HCP vs DLSS visual comparison and benchmark table" || exit 0
          git push
